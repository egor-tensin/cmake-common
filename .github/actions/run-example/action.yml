name: Run example project
description: Run example project
inputs:
  install_dir:
    description: Installation directory
    required: true
runs:
  using: composite
  steps:
    - env:
        ARG_INSTALL_DIR: ${{ inputs.install_dir }}
      run: |
        $install_dir = (Get-ChildItem env:ARG_INSTALL_DIR).Value

        if ((Get-ChildItem env:CI_HOST_LINUX).Value -and !(Get-ChildItem env:CI_TARGET_LINUX).Value) {
            echo 'Not going to do that on Linux + MinGW'
            exit
        }

        if ((Get-ChildItem env:CI_TARGET_LINUX).Value) {
            $lib = Join-Path $install_dir 'lib'
            if (Test-Path $lib) {
                $lib = Resolve-Path $lib
                $env:LD_LIBRARY_PATH = $lib
            }
        }
        $name = 'foo' + (Get-ChildItem env:CI_EXE_EXT).Value
        $path = Join-Path $install_dir 'bin' $name
        echo "Executable path: $path"
        & $path
      shell: pwsh
