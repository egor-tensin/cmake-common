name: Build Boost
description: Build Boost
inputs:
  boost-dir:
    description: Boost directory
    required: false
  toolset:
    description: Toolset to use
    required: false
    default: auto
  libraries:
    description: Libraries to build
    required: false
  platform:
    description: Target platform
    required: false
    default: x64
  configuration:
    description: Configuration to build
    required: false
    default: Debug
runs:
  using: composite
  steps:
    - env:
        ARG_BOOST_DIR: ${{ inputs.boost-dir }}
        ARG_LIBRARIES: ${{ inputs.libraries }}
        ARG_TOOLSET: ${{ inputs.toolset }}
        ARG_PLATFORM: ${{ inputs.platform }}
        ARG_CONFIGURATION: ${{ inputs.configuration }}
      run: |
        $python = 'python'

        $boost_dir = $env:ARG_BOOST_DIR
        if (-not $boost_dir) {
            $boost_dir = $env:BOOST_DIR
        }

        $libraries = $env:ARG_LIBRARIES
        $libraries = $libraries.Split(' ')
        if (-not $libraries) {
            Remove-Variable libraries
        }

        & $python `
            -m project.boost.build `
            --toolset $env:ARG_TOOLSET `
            --platform $env:ARG_PLATFORM `
            --configuration $env:ARG_CONFIGURATION `
            -- `
            $boost_dir `
            $libraries
      shell: pwsh
