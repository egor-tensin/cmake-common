name: Build Boost
description: Build Boost
inputs:
  boost_dir:
    description: Boost directory
    required: false
  toolset:
    description: Toolset to use
    required: false
    default: auto
  libraries:
    description: Libraries to build
    required: false
  platform:
    description: Target platform
    required: false
    default: x64
  configuration:
    description: Configuration to build
    required: false
    default: Debug
runs:
  using: composite
  steps:
    - env:
        ARG_BOOST_DIR: ${{ inputs.boost_dir }}
        ARG_LIBRARIES: ${{ inputs.libraries }}
        ARG_TOOLSET: ${{ inputs.toolset }}
        ARG_PLATFORM: ${{ inputs.platform }}
        ARG_CONFIGURATION: ${{ inputs.configuration }}
      run: |
        $boost_dir = (Get-ChildItem env:ARG_BOOST_DIR).Value
        if (-not $boost_dir) {
            $boost_dir = (Get-ChildItem env:BOOST_DIR).Value
        }
        $libraries = (Get-ChildItem env:ARG_LIBRARIES).Value
        $libraries = $libraries.Split(' ')
        if (-not $libraries) {
            Remove-Variable libraries
        }
        $toolset = (Get-ChildItem env:ARG_TOOLSET).Value
        $platform = (Get-ChildItem env:ARG_PLATFORM).Value
        $configuration = (Get-ChildItem env:ARG_CONFIGURATION).Value

        & python `
            -m project.boost.build `
            --toolset $toolset `
            --platform $platform `
            --configuration $configuration `
            -- `
            $boost_dir `
            $libraries
      shell: pwsh
