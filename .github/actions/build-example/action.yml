name: Build example project
description: Build example project
inputs:
  src-dir:
    description: Project directory
    required: true
  boost-dir:
    description: Boost directory
    required: false
  toolset:
    description: Toolset to use
    required: false
    default: auto
  platform:
    description: Target platform
    required: false
    default: x64
  configuration:
    description: Configuration to build
    required: false
    default: Debug
outputs:
  install-dir:
    description: Installation directory
    value: ${{ steps.install-dir.outputs.path }}
runs:
  using: composite
  steps:
    - id: install-dir
      env:
        ARG_SRC_DIR: ${{ inputs.src-dir }}
      run: |
        $src_dir = Resolve-Path $env:ARG_SRC_DIR
        $project_name = Split-Path $src_dir -Leaf
        $install_dir = Join-Path (Split-Path $env:GITHUB_WORKSPACE) "install_$project_name"
        echo "path=$install_dir" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - env:
        ARG_SRC_DIR: ${{ inputs.src-dir }}
        ARG_BOOST_DIR: ${{ inputs.boost-dir }}
        ARG_TOOLSET: ${{ inputs.toolset }}
        ARG_PLATFORM: ${{ inputs.platform }}
        ARG_CONFIGURATION: ${{ inputs.configuration }}
        INSTALL_DIR: ${{ steps.install-dir.outputs.path }}
      run: |
        $python = 'python'
        $src_dir = $env:ARG_SRC_DIR
        $install_dir = $env:INSTALL_DIR
        $boost_dir = $env:ARG_BOOST_DIR

        $args = @(
            '--install',
            $install_dir,
            '--platform',
            $env:ARG_PLATFORM,
            '--configuration',
            $env:ARG_CONFIGURATION,
            '--toolset',
            $env:ARG_TOOLSET
        )

        if ($boost_dir) {
            $args += '--boost',$boost_dir
        }

        $args += '--',$src_dir
        $env:VERBOSE = 1
        & $python -m project.build $args
      shell: pwsh
