name: Check that Boost was bootstrapped
description: Check that Boost was bootstrapped
runs:
  using: composite
  steps:
    - run: |
        echo '----------------------------------------------------------------'
        echo 'bootstrap.log'
        echo '----------------------------------------------------------------'
        $path = Join-Path (Get-ChildItem env:BOOST_DIR).Value 'bootstrap.log'
        if (Test-Path $path -Type Leaf) {
            cat $path
        }
      shell: pwsh
    - run: |
        echo ''
        echo '----------------------------------------------------------------'
        echo 'project-config.jam'
        echo '----------------------------------------------------------------'
        $path = Join-Path (Get-ChildItem env:BOOST_DIR).Value 'project-config.jam'
        if (Test-Path $path -Type Leaf) {
            cat $path
        }
      shell: pwsh
    - run: |
        echo ''
        echo '----------------------------------------------------------------'
        echo 'Checking that b2 executable was built'
        echo '----------------------------------------------------------------'
        $name = 'b2'
        if ((Get-ChildItem env:CI_HOST_WINDOWS).Value) {
            $name += '.exe'
        }
        $path = Join-Path (Get-ChildItem env:BOOST_DIR).Value $name

        if (!(Test-Path $path -Type Leaf)) {
            throw "b2 executable wasn't found"
        }
      shell: pwsh
