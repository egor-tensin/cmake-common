name: Verify architecture
description: Verify target architecture
inputs:
  path:
    description: Installation directory
    required: true
  expected:
    description: Target platform
    required: true
runs:
  using: composite
  steps:
    - env:
        ARG_PATH: ${{ inputs.path }}
        ARG_EXPECTED: ${{ inputs.expected }}
      run: |
        $script_path = if ($env:CI_TARGET_PE) {
            Join-Path $env:GITHUB_WORKSPACE 'test' 'scripts' 'verify_arch.ps1'
        } else {
            Join-Path $env:GITHUB_WORKSPACE 'test' 'scripts' 'verify_arch.sh'
        }

        $exe_path = (Join-Path $env:ARG_PATH 'bin' 'foo') + $env:CI_EXE_EXT

        & $script_path $exe_path $env:ARG_EXPECTED
      shell: pwsh
