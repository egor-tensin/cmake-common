name: Verify architecture
description: Verify target architecture
inputs:
  install_dir:
    description: Installation directory
    required: true
  expected:
    description: Target platform
    required: true
runs:
  using: composite
  steps:
    - env:
        ARG_INSTALL_DIR: ${{ inputs.install_dir }}
        ARG_EXPECTED: ${{ inputs.expected }}
      run: |
        $workspace = (Get-ChildItem env:GITHUB_WORKSPACE).Value
        $install_dir = (Get-ChildItem env:ARG_INSTALL_DIR).Value
        $expected = (Get-ChildItem env:ARG_EXPECTED).Value

        $script_path = if ((Get-ChildItem env:CI_TARGET_PE).Value) {
            Join-Path $workspace 'test' 'scripts' 'verify_arch.ps1'
        } else {
            Join-Path $workspace 'test' 'scripts' 'verify_arch.sh'
        }

        $name = 'foo' + (Get-ChildItem env:CI_EXE_EXT).Value
        $path = Join-Path $install_dir 'bin' $name

        & $script_path $path $expected
      shell: pwsh
