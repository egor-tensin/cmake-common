name: Linting

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  # Check that project.format works (and the C/C++ files are formatted).
  lint:
    runs-on: ubuntu-latest
    name: Linting
    continue-on-error: "${{ github.ref != 'refs/heads/master' }}"
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Run clang-format
        run: python -m project.format
      - name: Run black
        uses: psf/black@stable
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.7.1
